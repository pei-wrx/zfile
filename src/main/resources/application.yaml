server:
  port: 8090

spring:
  profiles:
    active: dev,local
  application:
    name: z-file
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  data:
    redis:
      database: 3
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 121MB

mybatis-plus:
  type-aliases-package: com.pei.zfile.**
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
  access-token-expiration: 1800000
  refresh-token-expiration: 60480000000